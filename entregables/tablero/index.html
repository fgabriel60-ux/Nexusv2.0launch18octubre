<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisión de videos · Nexus</title>
<style>
:root{--bg:#faf9f7;--panel:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--lin:#e2ddd5;
      --ok:#1f7a4d;--warn:#b26a00;--bad:#b3261e;--sel:#1f7a4d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#17181a;--panel:#1f2023;--fg:#ececec;--mut:#9a9a9a;--lin:#32343a;
  --ok:#4ec98a;--warn:#e0a14a;--bad:#ef6a60;--sel:#4ec98a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1120px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 18px;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--lin);border-radius:12px;padding:15px;margin-bottom:14px}
.cabe{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
h2{font-size:16px;margin:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.gris{background:color-mix(in srgb,var(--fg) 9%,transparent);color:var(--mut)}
.vers{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:9px;margin:11px 0}
.ver{border:1.5px solid var(--lin);border-radius:10px;padding:8px;cursor:pointer;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.ver:hover{border-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.ver.sel{border-color:var(--sel);box-shadow:0 0 0 2px color-mix(in srgb,var(--sel) 22%,transparent)}
.ver video{width:100%;border-radius:7px;background:#000;display:block;max-height:190px}
.vn{font-size:11.5px;font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.sinvid{font-size:11px;color:var(--mut);background:color-mix(in srgb,var(--fg) 6%,transparent);border-radius:7px;padding:16px 8px;text-align:center}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.col{border-radius:10px;padding:11px 12px;min-width:0}
.nos{background:color-mix(in srgb,var(--ok) 9%,transparent);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.cli{background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent)}
.ct{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.nos .ct{color:var(--ok)}.cli .ct{color:var(--warn)}
.col ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.col li{font-size:12.5px;overflow-wrap:anywhere}
.vacio{font-size:12.5px;color:var(--mut);margin:0}
button{font:inherit;font-size:12.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--lin);background:transparent;color:var(--fg);cursor:pointer}
button:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
button.pri{border-color:color-mix(in srgb,var(--ok) 60%,transparent);color:var(--ok);font-weight:600}
.btns{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:11px}
textarea{font:inherit;font-size:13px;width:100%;min-height:64px;padding:9px 11px;border-radius:9px;border:1px solid var(--lin);background:var(--bg);color:var(--fg);resize:vertical}
.dec{border:1px dashed var(--lin);border-radius:9px;padding:9px 11px;font-size:12.5px;display:flex;gap:9px;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
.dec span{min-width:0;overflow-wrap:anywhere}
.ref a{color:var(--fg);font-size:12px}
#aviso{font-size:12.5px;color:var(--mut);margin-top:8px}
@media(max-width:480px){.vers{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}}
/* Estado de todos (4 nov 2026): lo primero que ve Carlos al abrir */
.est{width:100%;border-collapse:collapse;font-size:12.5px}
.est th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--lin)}
.est td{padding:6px;border-bottom:1px solid var(--lin);vertical-align:top}
.est tr:last-child td{border-bottom:0}
.est .nom{font-weight:600;white-space:nowrap}
.est .falta{color:var(--mut);overflow-wrap:anywhere}
.est button{padding:3px 9px;font-size:11.5px}
.rap{white-space:pre-wrap;font-size:11.5px;background:color-mix(in srgb,var(--fg) 6%,transparent);border-radius:7px;padding:7px 8px;margin-top:6px;overflow-wrap:anywhere}
.minib{padding:3px 8px;font-size:11px}
@media(max-width:600px){.est .ocul{display:none}}
</style></head><body>
<div class="wrap">
  <h1>Revisión de videos</h1>
  <p class="sub">Todas las versiones que Glimmer ya calificó, con su video. Elige la correcta, mira qué nos toca a nosotros y qué falta que mande el cliente, y manda la orden: esto se escribe directo en el buzón y nexus3 lo ejecuta.</p>

  <div class="panel" id="panel-estado">
    <div class="cabe"><h2>Estado de todos</h2><span class="pill gris" id="resumen"></span></div>
    <div id="estado" style="margin-top:10px;overflow-x:auto"></div>
  </div>

  <div class="panel">
    <div class="cabe"><h2>Decisiones</h2></div>
    <div id="decs" style="margin-top:10px"></div>
    <div class="btns">
      <button class="pri" id="enviar" type="button">Enviar órdenes a Claude</button>
      <button id="limpiar" type="button">Limpiar</button>
    </div>
    <p id="aviso"></p>
  </div>

  <div id="lista"></div>
</div>
<script>
(function(){
  var K=new URLSearchParams(location.search).get('k')||'';
  var q=function(u){return u+(u.indexOf('?')<0?'?':'&')+'k='+encodeURIComponent(K);};
  var decs=[], eleg={}, datos=[];

  function n(v){var x=Number(v);return isFinite(x)?x:0;}
  function cls(a){return a>=8?'ok':(a>=7?'warn':'bad');}
  function pill(t,c){var s=document.createElement('span');s.className='pill '+c;s.textContent=t;return s;}

  function anota(cliente,texto,tipo){
    decs=decs.filter(function(d){return !(d.cliente===cliente&&d.tipo===tipo);});
    decs.push({cliente:cliente,texto:texto,tipo:tipo});
    pintarDecs();
  }
  function pintarDecs(){
    var L=document.getElementById('decs');L.textContent='';
    if(!decs.length){var p=document.createElement('p');p.className='vacio';
      p.textContent='Todavía no has aprobado ni ordenado nada.';L.appendChild(p);return;}
    decs.forEach(function(d,i){
      var w=document.createElement('div');w.className='dec';
      var s=document.createElement('span');
      s.textContent=(d.tipo==='aprobado'?'✅ ':'✍️ ')+d.cliente+' — '+d.texto;
      var b=document.createElement('button');b.type='button';b.textContent='Quitar';
      b.onclick=function(){decs.splice(i,1);pintarDecs();};
      w.appendChild(s);w.appendChild(b);L.appendChild(w);
    });
  }

  function listaCol(titulo,items,c,vacio){
    var d=document.createElement('div');d.className='col '+c;
    var t=document.createElement('p');t.className='ct';t.textContent=titulo;d.appendChild(t);
    if(!items||!items.length){var e=document.createElement('p');e.className='vacio';e.textContent=vacio;d.appendChild(e);return d;}
    var ul=document.createElement('ul');
    items.forEach(function(x){var li=document.createElement('li');li.textContent=x;ul.appendChild(li);});
    d.appendChild(ul);return d;
  }
  function tareas(r,v){
    var h=document.getElementById('t-'+r.slug);if(!h)return;
    h.textContent='';
    h.appendChild(listaCol('Nos toca a nosotros',v.nosotros,'nos','Nada pendiente de nuestro lado.'));
    h.appendChild(listaCol('Lo tiene que mandar el cliente',v.cliente,'cli','No necesitamos nada de él.'));
  }

  function pintaEstado(){
    var cont=document.getElementById('estado');cont.textContent='';
    var orden={'Rojo':0,'Naranja':1,'Amarillo':2,'Verde':3};
    var rs=datos.filter(function(r){return r.cliente;}).slice().sort(function(a,b){
      var oa=orden[a.alerta]!=null?orden[a.alerta]:9, ob=orden[b.alerta]!=null?orden[b.alerta]:9;
      if(oa!==ob)return oa-ob;
      return n(b.riesgo)-n(a.riesgo);
    });
    var t=document.createElement('table');t.className='est';
    var th=document.createElement('tr');
    ['Negocio','Nota','Facebook','Versiones','Estado','Qué falta',''].forEach(function(x,i){
      var c=document.createElement('th');c.textContent=x;if(i===5)c.className='ocul';th.appendChild(c);});
    t.appendChild(th);
    var rojos=0, listos=0, conCampana=0;
    rs.forEach(function(r){
      if(r.alerta==='Rojo')rojos++;
      if(n(r.mejor)>=8)listos++;
      if(r.campana)conCampana++;
      var tr=document.createElement('tr');
      var c1=document.createElement('td');c1.className='nom';
      c1.textContent=r.cliente;
      if(r.tipo==='Prospecto'){var pp=document.createElement('span');pp.className='pill gris';pp.style.marginLeft='6px';pp.textContent='prospecto';c1.appendChild(pp);}
      if(r.campana){var pc=document.createElement('span');pc.className='pill ok';pc.style.marginLeft='6px';pc.textContent='campaña';c1.appendChild(pc);}
      if(r.sin_gpu){var pg=document.createElement('span');pg.className='pill ok';pg.style.marginLeft='6px';pg.textContent='sin GPU';c1.appendChild(pg);}
      else if(r.necesita_gpu){var pn=document.createElement('span');pn.className='pill warn';pn.style.marginLeft='6px';pn.textContent='escenas';c1.appendChild(pn);}
      tr.appendChild(c1);
      var c2=document.createElement('td');c2.appendChild(pill(n(r.mejor).toFixed(1),cls(n(r.mejor))));tr.appendChild(c2);
      var cf=document.createElement('td');
      if(r.facebook&&r.facebook.nota!=null)cf.appendChild(pill(Number(r.facebook.nota).toFixed(1),cls(Number(r.facebook.nota))));
      else{var gg=document.createElement('span');gg.style.color='var(--mut)';gg.textContent='—';cf.appendChild(gg);}
      tr.appendChild(cf);
      var c3=document.createElement('td');c3.textContent=r.n;tr.appendChild(c3);
      var c4=document.createElement('td');
      if(r.alerta)c4.appendChild(pill(r.alerta,r.alerta==='Rojo'?'bad':(r.alerta==='Naranja'?'warn':'gris')));
      if(r.estado){var e=document.createElement('span');e.className='pill gris';e.style.marginLeft='5px';e.textContent=r.estado;c4.appendChild(e);}
      tr.appendChild(c4);
      var c5=document.createElement('td');c5.className='falta ocul';
      c5.textContent=(r.falta_de_el||r.porque_urge||'').slice(0,150);tr.appendChild(c5);
      var c6=document.createElement('td');
      var b=document.createElement('button');b.type='button';b.textContent='Ver';
      b.onclick=function(){var el=document.getElementById('p-'+r.slug);
        if(!el){alert('No encuentro la ficha de '+r.cliente+' («'+r.slug+'»).');return;}
        var fb=document.getElementById('fb-'+r.slug); if(fb) fb.open=true;   // abre el plan de Facebook
        el.scrollIntoView({behavior:'smooth',block:'start'});el.style.outline='2px solid var(--sel)';
        setTimeout(function(){el.style.outline='';},1600);};
      c6.appendChild(b);tr.appendChild(c6);
      t.appendChild(tr);
    });
    cont.appendChild(t);
    document.getElementById('resumen').textContent=rs.length+' negocios · '+listos+' en 8 o más · '+rojos+' en rojo · '+conCampana+' con campaña';
  }

  function pinta(){
    var L=document.getElementById('lista');L.textContent='';
    /* 5 nov 2026: la primera entrada de datos.json son las tareas del día, no un
       cliente: no trae `versiones`, así que `r.versiones.forEach` reventaba en la
       primera vuelta y NINGUNA ficha se dibujaba. El botón «Ver» fallaba callado
       porque buscaba un panel que nunca se creó. Ahora se saltan las entradas que
       no son clientes y cada ficha va protegida: si una trae datos raros se pierde
       esa, no las demás. */
    datos.filter(function(r){return r && r.cliente && r.slug;}).forEach(function(r){
     try{
      if(!Array.isArray(r.versiones)) r.versiones=[];
      var p=document.createElement('div');p.className='panel';p.id='p-'+r.slug;
      var cab=document.createElement('div');cab.className='cabe';
      var h=document.createElement('h2');h.textContent=r.cliente;cab.appendChild(h);
      cab.appendChild(pill(r.facilidad,r.facilidad==='Fácil'?'ok':(r.facilidad==='Medio'?'warn':'gris')));
      cab.appendChild(pill(r.n+(r.n===1?' versión':' versiones'),'gris'));
      cab.appendChild(pill('Mejor '+n(r.mejor).toFixed(1),cls(n(r.mejor))));
      p.appendChild(cab);

      if(r.facebook && r.facebook.texto){
        var fb=document.createElement('details');fb.id='fb-'+r.slug;
        fb.style.cssText='margin:10px 0 0;border:1px solid var(--lin);border-radius:8px;padding:10px 12px;background:var(--bg)';
        var sm=document.createElement('summary');
        sm.style.cssText='cursor:pointer;font-weight:600;list-style:revert';
        sm.textContent='📘 Plan de la IA de Facebook · hoy en '+r.facebook.nota+'/10 — cómo subirlo';
        fb.appendChild(sm);
        var tx=document.createElement('pre');
        tx.style.cssText='white-space:pre-wrap;font:14px/1.55 inherit;margin:10px 0 0;color:var(--fg)';
        tx.textContent=r.facebook.texto;
        fb.appendChild(tx);p.appendChild(fb);
      }

      var zp=document.createElement('div');zp.style.cssText='margin:10px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap';
      var bp=document.createElement('button');bp.type='button';bp.className='pri';
      bp.textContent='🚀 Disparar el plan en nexus3';
      var sp=document.createElement('span');sp.style.cssText='font-size:13px;color:var(--mut)';
      zp.appendChild(bp);zp.appendChild(sp);p.appendChild(zp);
      var armado=false,reloj=null;
      bp.onclick=function(){
        if(!armado){                                   // primer clic: pedir confirmación
          armado=true;bp.textContent='¿Seguro? Toca otra vez';bp.style.background='#b26a00';
          sp.textContent='Se va a trabajar el plan de '+r.cliente+'.';
          reloj=setTimeout(function(){armado=false;bp.textContent='🚀 Disparar el plan en nexus3';
            bp.style.background='';sp.textContent='';},5000);
          return;
        }
        clearTimeout(reloj);armado=false;bp.disabled=true;
        bp.textContent='Mandando…';bp.style.background='';sp.textContent='';
        fetch(q('/plan'),{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({slug:r.slug})})
          .then(function(x){return x.json();})
          .then(function(j){
            if(j.ok){bp.textContent='✅ Disparado';
              sp.textContent='nexus3 lo toma en su próxima vuelta. El video aparece aquí solo y suena.';
              if(!j.plan) sp.textContent+=' (Ojo: este cliente no tiene plan de Facebook guardado.)';
            } else {bp.disabled=false;bp.textContent='🚀 Disparar el plan en nexus3';
              sp.textContent='No se pudo: '+(j.error||'error');}
          })
          .catch(function(e){bp.disabled=false;bp.textContent='🚀 Disparar el plan en nexus3';
            sp.textContent='No se pudo: '+e.message;});
      };


      if(r.referencia){
        var rf=document.createElement('p');rf.className='ref';rf.style.margin='8px 0 0';
        var a=document.createElement('a');a.href=r.referencia;a.target='_blank';a.rel='noopener';
        a.textContent='▶ Ver la referencia que se usó';rf.appendChild(a);p.appendChild(rf);
      }

      var vs=document.createElement('div');vs.className='vers';
      r.versiones.forEach(function(v){
        var d=document.createElement('div');d.className='ver'+(eleg[r.slug]===v.version?' sel':'');
        d.setAttribute('role','button');d.tabIndex=0;
        if(v.vurl){var vd=document.createElement('video');vd.controls=true;vd.preload='none';
          vd.playsInline=true;vd.src=q(v.vurl);d.appendChild(vd);}
        else{var sv=document.createElement('div');sv.className='sinvid';sv.textContent='sin archivo';d.appendChild(sv);}
        var nm=document.createElement('div');nm.className='vn';nm.textContent=v.version;d.appendChild(nm);
        var ps=document.createElement('div');ps.className='cabe';
        ps.appendChild(pill(n(v.actual).toFixed(1),cls(n(v.actual))));
        if(v.proyectada!=null)ps.appendChild(pill('→'+n(v.proyectada).toFixed(1),'gris'));
        ps.appendChild(pill(v.fecha,'gris'));
        d.appendChild(ps);
        if(v.vurl){
          var rb=document.createElement('button');rb.type='button';rb.className='minib';
          rb.textContent=v.rapido?'⚡ Volver a calificar':'⚡ Glimmer rápido';
          var caja=document.createElement('div');caja.className='rap';caja.hidden=!v.rapido;
          if(v.rapido)caja.textContent=v.rapido;
          rb.onclick=function(ev){
            ev.stopPropagation();
            rb.disabled=true;caja.hidden=false;caja.textContent='Glimmer está viendo el video… (la primera tarda ~2 min, las siguientes segundos)';
            fetch(q('/rapido'),{method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({video:v.vurl.split('/').pop(),cliente:r.cliente,version:v.version,
                                   contexto:(v.nota||'')})})
              .then(function(x){return x.json();})
              .then(function(j){caja.textContent=j.ok?j.texto:('No se pudo: '+(j.error||'error'));
                                rb.disabled=false;rb.textContent='⚡ Volver a calificar';})
              .catch(function(e){caja.textContent='No se pudo: '+e.message;rb.disabled=false;});
          };
          d.appendChild(rb);d.appendChild(caja);
        }
        function elegir(){eleg[r.slug]=v.version;
          vs.querySelectorAll('.ver').forEach(function(e){e.classList.remove('sel');});
          d.classList.add('sel');tareas(r,v);}
        d.onclick=elegir;
        d.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();elegir();}};
        vs.appendChild(d);
      });
      p.appendChild(vs);

      var t=document.createElement('div');t.className='dos';t.id='t-'+r.slug;p.appendChild(t);

      var bs=document.createElement('div');bs.className='btns';
      var ap=document.createElement('button');ap.className='pri';ap.type='button';ap.textContent='Aprobar este video';
      ap.onclick=function(){
        var v=eleg[r.slug]||r.versiones[0].version;eleg[r.slug]=v;
        anota(r.cliente,'APROBADO el video '+v+'. Mandárselo y hacer lo nuestro.','aprobado');
        ap.textContent='Aprobado ✓';setTimeout(function(){ap.textContent='Aprobar este video';},1800);
      };
      var oc=document.createElement('button');oc.type='button';oc.textContent='Cambiar la orden';
      var apl=document.createElement('button');apl.type='button';apl.className='pri';
      apl.textContent='⚡ Aplicar los cambios ya';
      var avi=document.createElement('span');avi.style.fontSize='12px';avi.style.color='var(--mut)';
      apl.onclick=function(){
        var v=r.versiones.filter(function(x){return x.version===eleg[r.slug];})[0]||r.versiones[0];
        var tareas=(v.nosotros||[]).concat(v.cliente||[]);
        apl.disabled=true;avi.textContent=' mandando a nexus3…';
        fetch(q('/aplicar'),{method:'POST',headers:{'content-type':'application/json'},
          body:JSON.stringify({slug:r.slug,cliente:r.cliente,version:v.version,sin_gpu:!!r.sin_gpu,tareas:tareas})})
         .then(function(x){return x.json();})
         .then(function(j){avi.textContent=j.ok?(' ✅ nexus3 lo tomó ('+j.archivo+')'):(' no se pudo: '+(j.error||'error'));
                           apl.disabled=false;})
         .catch(function(e){avi.textContent=' no se pudo: '+e.message;apl.disabled=false;});
      };
      bs.appendChild(ap);bs.appendChild(apl);bs.appendChild(oc);bs.appendChild(avi);p.appendChild(bs);

      var caja=document.createElement('div');caja.hidden=true;caja.style.marginTop='9px';
      var ta=document.createElement('textarea');
      ta.placeholder='Ej.: usa la v9b, no la v3, y no le pidas el precio del portón todavía';
      caja.appendChild(ta);
      var bg=document.createElement('div');bg.className='btns';
      var gu=document.createElement('button');gu.className='pri';gu.type='button';gu.textContent='Guardar orden';
      gu.onclick=function(){var x=(ta.value||'').trim();if(!x)return;
        anota(r.cliente,x,'orden');ta.value='';caja.hidden=true;};
      bg.appendChild(gu);caja.appendChild(bg);
      oc.onclick=function(){caja.hidden=!caja.hidden;if(!caja.hidden)ta.focus();};
      p.appendChild(caja);

      L.appendChild(p);
      tareas(r,r.versiones.filter(function(v){return v.version===eleg[r.slug];})[0]||r.versiones[0]);
     }catch(e){
      var pe=document.createElement('div');pe.className='panel';pe.id='p-'+r.slug;
      pe.textContent='No pude dibujar la ficha de '+(r.cliente||'?')+': '+e.message;
      L.appendChild(pe);
     }
    });
  }

  document.getElementById('limpiar').onclick=function(){decs=[];pintarDecs();};
  document.getElementById('enviar').onclick=function(){
    var av=document.getElementById('aviso');
    if(!decs.length){av.textContent='No hay nada que enviar.';return;}
    av.textContent='Enviando…';
    fetch(q('/orden'),{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({decisiones:decs})})
      .then(function(r){return r.json();})
      .then(function(j){
        av.textContent=j.ok?('Listo: '+j.n+' órdenes quedaron en el buzón ('+j.archivo+'). Claude las toma en su próxima vuelta.')
                           :('No se pudo: '+(j.error||'error'));
        if(j.ok){decs=[];pintarDecs();}
      })
      .catch(function(e){av.textContent='No se pudo enviar: '+e.message;});
  };

  function pintaSinAsignar(cab){
    var lista=(cab&&cab._facebook_sin_asignar)||[];
    if(!lista.length)return;
    var p=document.createElement('div');p.className='panel';
    var h=document.createElement('h2');h.textContent='📘 Análisis de Facebook sin asignar ('+lista.length+')';
    p.appendChild(h);
    var s=document.createElement('p');s.style.color='var(--mut)';s.style.margin='4px 0 10px';
    s.textContent='Estos llegaron en el mismo lote pero no supe de qué cliente son. Dime de quién es cada uno y lo pego en su ficha.';
    p.appendChild(s);
    lista.forEach(function(a){
      var d=document.createElement('details');
      d.style.cssText='border:1px solid var(--lin);border-radius:8px;padding:10px 12px;margin:0 0 8px;background:var(--bg)';
      var sm=document.createElement('summary');sm.style.cssText='cursor:pointer;font-weight:600;list-style:revert';
      sm.textContent=a.titulo+(a.nota!=null?(' · '+a.nota+'/10'):'')+' · '+a.hora;
      d.appendChild(sm);
      var tx=document.createElement('pre');
      tx.style.cssText='white-space:pre-wrap;font:14px/1.55 inherit;margin:10px 0 0';
      tx.textContent=a.texto;d.appendChild(tx);p.appendChild(d);
    });
    document.getElementById('lista').appendChild(p);
  }

  fetch(q('/datos.json')).then(function(r){return r.json();}).then(function(j){
    datos=j||[];pintarDecs();pintaEstado();pinta();pintaSinAsignar(j[0]);
  }).catch(function(e){
    document.getElementById('lista').textContent='No pude cargar los datos: '+e.message;
  });

  // ── Avisa cuando nexus3 deja un video nuevo ───────────────────────────────
  var marca=Date.now()/1000, avisando=false;
  function beep(){
    try{
      var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
      var a=new C(); if(a.state==='suspended'&&a.resume) a.resume();
      [0,0.18].forEach(function(t,i){
        var o=a.createOscillator(),g=a.createGain();
        o.type='sine'; o.frequency.value=i?1046:784;        // sol → do, dos notas cortas
        g.gain.setValueAtTime(0.0001,a.currentTime+t);
        g.gain.exponentialRampToValueAtTime(0.25,a.currentTime+t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+0.16);
        o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+0.18);
      });
    }catch(e){}
  }
  function banner(txt){
    var b=document.getElementById('avisovideo');
    if(!b){b=document.createElement('div');b.id='avisovideo';
      b.style.cssText='position:sticky;top:0;z-index:50;background:var(--ok);color:#fff;'+
        'padding:12px 16px;border-radius:8px;margin:0 0 12px;font-weight:600;cursor:pointer';
      b.onclick=function(){location.reload();};
      document.body.insertBefore(b,document.body.firstChild);}
    b.textContent='🎬 '+txt+' · toca para verlo';
  }
  function mirar(){
    fetch(q('/novedades')+'&desde='+marca).then(function(x){return x.json();}).then(function(j){
      if(j.nuevos&&j.nuevos.length){
        marca=j.ahora;
        if(!avisando){avisando=true;beep();
          banner('Llegó video nuevo: '+j.nuevos[0].archivo);
          setTimeout(function(){avisando=false;},3000);}
      }
    }).catch(function(){});
  }
  setInterval(mirar,10000);
  document.addEventListener('click',function arranca(){beep.permitido=true;
    document.removeEventListener('click',arranca);},{once:true});
})();
</script></body></html>
